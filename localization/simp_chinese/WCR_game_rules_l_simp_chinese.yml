# Game rules

l_simp_chinese:
    WCR_AWC_behavior_text:     "这是来自#bold 采用西式服装#!的原始行为。"
    WCR_vanilla_behavior_text: "这是来自#bold 未修改游戏#!的原始行为。"
    
    WCR_gov_employee_text: "[Concept('concept_government_building', '$concept_government$')]和[Concept('concept_military_building', '$military$')]就业者#p 将总是#!西化的。"
    
    WCR_rule_yes: "#b 是#!"
    WCR_rule_no:  "#b 否#!"
    
    rule_WCR_westernization_type:            "#yellow WCR#!：西化模式"
    setting_WCR_complex_westernization:      "#b 渐进的#!"
    setting_WCR_complex_westernization_desc: "#v 西化#!将会通过一个[concept_journal_entry]逐渐出现。"
    setting_WCR_simple_westernization:       "#b 立即的#!"
    setting_WCR_simple_westernization_desc:  "#v 西化#!将会通过一个决议立即发生。$WCR_AWC_behavior_text$"
    
    rule_WCR_decision_requirements_type: "#yellow WCR#!：西化要求"
    setting_WCR_WCF_requirements:        "#b 标准#!"
    setting_WCR_WCF_requirements_desc:   "#v 西化#!将会需要满足更多#v 复杂但灵活的要求#!去解锁。"
    setting_WCR_AWC_requirements:        "#b 传统#!"
    setting_WCR_AWC_requirements_desc:   "#v 西化#!将会根据#bold 采用西式服装#!mod中的#v 简单要求#!来解锁。"
    
    rule_WCR_westernization_influences:  "#yellow WCR#!：制服风格"
    setting_WCR_enable_influences:       "#b 使用者选择#!"
    setting_WCR_enable_influences_desc:  "[Concept('concept_head_of_state', '君主')]与军队的制服风格将会由使用者在西化的过程中选择。"
    setting_WCR_disable_influences:      "#b 总是通用风格#!"
    setting_WCR_disable_influences_desc: "[Concept('concept_head_of_state', '君主')]与军队的制服风格将总是通用的欧式制服。$WCR_AWC_behavior_text$"
    
    rule_WCR_fake_late_uniforms:             "#yellow WCR#!：使用虚构的晚期国家制服"
    setting_WCR_fake_late_uniforms_yes:      "$WCR_rule_yes$"
    setting_WCR_fake_late_uniforms_yes_desc: "采用本地制服风格（如有条件）的[Concept('concept_country', '$concept_countries$')]在获得足够的[Concept('concept_technology','technological progress')]后，#p 将#!改用虚构的现代设计。#i 需要#underline $dlc010$#!DLC。#!"
    setting_WCR_fake_late_uniforms_no:       "$WCR_rule_no$"
    setting_WCR_fake_late_uniforms_no_desc:  "采用本地制服风格（如有条件）的[Concept('concept_country', '$concept_countries$')]#n 将不会#!改用虚构的现代设计。"
    
    rule_WCR_AI_westernization:               "#yellow WCR#!：允许AI进行西化"
    setting_WCR_allow_AI_westernization:      "$WCR_rule_yes$"
    setting_WCR_allow_AI_westernization_desc: "AI国家#p 将#!被允许进行西化。"
    setting_WCR_block_AI_westernization:      "$WCR_rule_no$"
    setting_WCR_block_AI_westernization_desc: "AI国家#n 将不#!被允许进行西化。$WCR_AWC_behavior_text$"
    
    rule_WCR_KOR_westernization:                 "#yellow WCR#!：$KOR_ADJ$西化表现"
    setting_WCR_modded_KOR_westernization:       "#b WCR#!"
    setting_WCR_modded_KOR_westernization_desc:  "#v $KOR$#!将只使用WCR增加的机制和条件进行西化。"
    setting_WCR_mixed_KOR_westernization:        "#b 混合#!"
    setting_WCR_mixed_KOR_westernization_desc:   "#v $KOR$#!将使用WCR增加的机制进行西化，但在宣布成立#v $dyn_c_empire_of_korea$#!后，将能够绕过西化要求。"
    setting_WCR_vanilla_KOR_westernization:      "#b 无修改#!"
    setting_WCR_vanilla_KOR_westernization_desc: "#v $KOR$#!将被WCR忽视，并在宣布成立#v $dyn_c_empire_of_korea$#!后自动西化。"
    
    rule_WCR_KOR_uniforms:                 "#yellow WCR#!：$KOR_ADJ$西式制服"
    setting_WCR_modded_KOR_uniforms:       "$setting_WCR_modded_KOR_westernization$"
    setting_WCR_modded_KOR_uniforms_desc:  "$KOR_ADJ$制服的样式将根据当前游戏规则由WCR确定。如果#v $setting_WCR_enable_influences$#!规则已激活，则基础游戏中的特殊#v $dyn_c_empire_of_korea$制服#!将成为可选项。"
    setting_WCR_vanilla_KOR_uniforms:      "$setting_WCR_vanilla_KOR_westernization$"
    setting_WCR_vanilla_KOR_uniforms_desc: "除非#v $setting_WCR_disable_influences$#!规则已激活，否则$KOR_ADJ$制服的样式将始终是基础游戏中的特殊#v $dyn_c_empire_of_korea$制服#!。"
    
    rule_WCR_JAP_westernization:                 "#yellow WCR#!：$JAP_ADJ$西化表现"
    setting_WCR_modded_JAP_westernization:       "$setting_WCR_modded_KOR_westernization$"
    setting_WCR_modded_JAP_westernization_desc:  "#v $JAP$#!将只使用WCR增加的机制和条件进行西化。"
    setting_WCR_mixed_JAP_westernization:        "$setting_WCR_mixed_KOR_westernization$"
    setting_WCR_mixed_JAP_westernization_desc:   "#v $JAP$#!将使用WCR增加的机制进行西化，但在完成#v $je_meiji_restoration$#![concept_journal_entry]后，将能够绕过西化要求。"
    setting_WCR_vanilla_JAP_westernization:      "$setting_WCR_vanilla_KOR_westernization$"
    setting_WCR_vanilla_JAP_westernization_desc: "#v $JAP$#!将被WCR忽视，并在完成#v $je_meiji_restoration$#![concept_journal_entry]后自动西化。"
    
    rule_WCR_JAP_uniforms:                 "#yellow WCR#!：$JAP_ADJ$西式制服"
    setting_WCR_modded_JAP_uniforms:       "$setting_WCR_modded_KOR_westernization$"
    setting_WCR_modded_JAP_uniforms_desc:  "$JAP_ADJ$制服的样式将根据当前游戏规则由WCR确定。如果#v $setting_WCR_enable_influences$#!规则已激活，则基础游戏中的特殊#v $dyn_c_empire_of_japan$制服#!将成为可选项。"
    setting_WCR_vanilla_JAP_uniforms:      "$setting_WCR_vanilla_KOR_westernization$"
    setting_WCR_vanilla_JAP_uniforms_desc: "除非#v $setting_WCR_disable_influences$#!规则已激活，否则$JAP_ADJ$制服的样式将始终是基础游戏中的特殊#v $dyn_c_empire_of_japan$制服#!。"
    
    rule_WCR_unwesternizeds_type:                  "#yellow WCR#!：未西化的人群与角色行为"
    setting_WCR_unwesternizeds_type_never:         "永不西化"
    setting_WCR_unwesternizeds_type_never_desc:    "生活在西化[Concept('concept_country', '$concept_countries$')]中的未西化[Concept('concept_pop', '$concept_pops$')]和[Concept('concept_character', '$concept_characters$')]#n 将永不#!西化，如果他们不属于任何[concept_primary_cultures]的话。$WCR_gov_employee_text$"
    setting_WCR_unwesternizeds_type_migrants:      "仅移民西化"
    setting_WCR_unwesternizeds_type_migrants_desc: "生活在西化[concept_country]的未西化[Concept('concept_pop', '$concept_pops$')]和[Concept('concept_character', '$concept_characters$')]#p 将#!自动西化，如果他们不属于任何[concept_primary_cultures]的话。$WCR_gov_employee_text$"
    setting_WCR_unwesternizeds_type_wealth:        "财富与接受度西化"
    setting_WCR_unwesternizeds_type_wealth_desc:   "在西化的[Concept('concept_country', '$concept_countries$')]中，未西化的[Concept('concept_pop', '$concept_pops$')]#p 将#!根据其[concept_sol]和[Concept('concept_discrimination', '$ACCEPTANCE$')]进行西化。不西化[Concept('concept_character', '$concept_characters$')]与$WCR_gov_employee_text$"
    setting_WCR_unwesternizeds_type_always:        "总是西化"
    setting_WCR_unwesternizeds_type_always_desc:   "生活在西化[Concept('concept_country', '$concept_countries$')]中的未西化[Concept('concept_pop', '$concept_pops$')]和[Concept('concept_character', '$concept_characters$')]#p 将总是#!西化。"
    
    rule_WCR_westernize_traditionalists:             "#yellow WCR#!：西化传统主义者"
    setting_WCR_westernize_traditionalists_yes:      "$WCR_rule_yes$"
    setting_WCR_westernize_traditionalists_yes_desc: "如果没有别的办法让他们不西化，那么拥有[GetIdeology('ideology_traditionalist').GetName][concept_ideology]的[Concept('concept_character', '$concept_characters$')]#p 将#!西化。$WCR_AWC_behavior_text$"
    setting_WCR_westernize_traditionalists_no:       "$WCR_rule_no$"
    setting_WCR_westernize_traditionalists_no_desc:  "拥有[GetIdeology('ideology_traditionalist').GetName][concept_ideology]的[Concept('concept_character', '$concept_characters$')]#n 将不会#!西化。如果他们是#v $ig_armed_forces$#![concept_interest_group]的[concept_leader]或者是一个[concept_commander]，他们仍然会西化。"
    
    rule_WCR_westernize_ig_rural_folk:             "#yellow WCR#!：西化#green @rural_folk!$ig_rural_folk$#!"
    setting_WCR_westernize_ig_rural_folk_yes:      "$WCR_rule_yes$"
    setting_WCR_westernize_ig_rural_folk_yes_desc: "#green;bold @rural_folk!$ig_rural_folk$#![concept_interest_group]的[concept_leader]#p 将#!西化。"
    setting_WCR_westernize_ig_rural_folk_no:       "$WCR_rule_no$"
    setting_WCR_westernize_ig_rural_folk_no_desc:  "#green;bold @rural_folk!$ig_rural_folk$#![concept_interest_group]的[concept_leader]#n 将不会#!西化。$WCR_AWC_behavior_text$"
    
    rule_WCR_westernize_ig_devout:             "#yellow WCR#!：西化#blue @devout!$ig_devout$#!"
    setting_WCR_westernize_ig_devout_yes:      "$WCR_rule_yes$"
    setting_WCR_westernize_ig_devout_yes_desc: "#blue;bold @devout!$ig_devout$#![concept_interest_group]的[concept_leader]#p 将#!西化。"
    setting_WCR_westernize_ig_devout_no:       "$WCR_rule_no$"
    setting_WCR_westernize_ig_devout_no_desc:  "#blue;bold @devout!$ig_devout$#![concept_interest_group]的[concept_leader]#n 将不会#!西化。$WCR_AWC_behavior_text$"
    
    rule_WCR_westernize_poor_pop_clothing:             "#yellow WCR#!：西化贫穷人群服饰"
    setting_WCR_westernize_poor_pop_clothing_yes:      "$WCR_rule_yes$"
    setting_WCR_westernize_poor_pop_clothing_yes_desc: "#yellow $farmers$#!、#yellow $peasants$#!和#yellow $laborers$#!将西化#v 他们的整套服装#!。他们也会#v 只戴西式帽子#!。"
    setting_WCR_westernize_poor_pop_clothing_no:       "$WCR_rule_no$"
    setting_WCR_westernize_poor_pop_clothing_no_desc:  "#yellow $farmers$#!、#yellow $peasants$#!、#yellow $laborers$#!将只会西化#v 他们的帽子#!并与#v 他们原来的帽子混用#!。#yellow $machinists$#!将仍然完整进行西化。$WCR_AWC_behavior_text$"
