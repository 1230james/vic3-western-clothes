# Westernization JE & Event text

l_simp_chinese:
    # Journal entries
    WCR_je_westernization:        "西化"
    WCR_je_westernization_goal:   "" # Defined to silence errors
    WCR_je_westernization_reason: "如果我们要在这个快速工业化的世界上成为一个真正的强国，并防止丧失主权，我们的国家就必须与西方人平起平坐，无论代价是什么。这其中必须包括将西方习俗融入我们的社会。\n\n$WCR_je_westernization_reason_long$"
    
    # Decisions
    WCR_de_start_westernization:         "开始西化"
    WCR_de_start_westernization_desc:    "开始国家西化进程。\n完成西化后，大多数人群和角色都将穿上西式服装。"
    WCR_de_start_westernization_tooltip: "$WCR_de_start_westernization$"
    
    WCR_de_simple_westernization:         "采用西式服装"
    WCR_de_simple_westernization_desc:    "我们要想在世界舞台上屹立于西方强国之林，就必须在生活方式上与他们并驾齐驱。作为这一目标的一部分，我国人民应采用西式服装。"
    WCR_de_simple_westernization_tooltip: "$WCR_de_simple_westernization$"
    
    # Tooltips
    WCR_tt_overlord_westernized_sub: "[GetPlayer.GetOverlord.GetName]已#bold 西化#!"
    WCR_tt_overlord_westernized_ind: "[GetPlayer.GetName]的[concept_overlord]已#bold 西化#!。"
    WCR_tt_ruler_support:            "[GetPlayer.GetRuler.GetCustom('GetUniversalFullName')]属于一个$WCR_tt_progressives_tt$[concept_interest_group]"
    
    WCR_tt_KOR_req_bypass: "#b $dyn_c_empire_of_korea$#!已宣告成立。"
    WCR_tt_JAP_req_bypass: "#b $je_meiji_restoration$#![concept_journal_entry]已经完成。"
    
    WCR_tt_IG_list_item:       "[THIS.GetInterestGroup.GetName]"
    WCR_tt_IG_list_item_debug: "[THIS.GetInterestGroup.GetName] ([THIS.GetInterestGroup.MakeScope.ScriptValue('WCR_sv_calculate_IG_progressive_score')])"
    WCR_tt_conservatives_list: "$WCR_tt_IG_cooltip_header$\n[GetScriptedGui('WCR_sg_conservatives_list').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
    WCR_tt_progressives_list:  "$WCR_tt_IG_cooltip_header$\n[GetScriptedGui('WCR_sg_progressives_list').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
    WCR_tt_conservatives_tt:   "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],WCR_tt_conservatives_list $WCR_txt_conservative$#!"
    WCR_tt_progressives_tt:    "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],WCR_tt_progressives_list $WCR_txt_progressive$#!"
    
    WCR_txt_conservative:      "保守"
    WCR_txt_progressive:       "进步"
    WCR_tt_IG_cooltip_header:  "是下列[Concept('concept_interest_group', '$concept_interest_groups$')]之一："
    WCR_tt_is_conservative_IG: "是$WCR_tt_conservatives_tt$[concept_interest_group]"
    WCR_tt_is_progressive_IG:  "是$WCR_tt_progressives_tt$[concept_interest_group]"
    
    # Modifiers
    WCR_westernized_modifier:         "近期已西化"
    WCR_ig_westernization_1_modifier: "开始西化"
    WCR_ig_westernization_2_modifier: "$WCR_ig_westernization_1_modifier$"
    WCR_ig_westernization_3_modifier: "不完全的西化"
    WCR_ig_westernization_4_modifier: "$WCR_ig_westernization_3_modifier$"
    WCR_ig_westernized_modifier:      "西化国家"
    
    # Events
    WCR_ev_1_title:  "西化！"
    WCR_ev_1_desc:   "在长期接触西方技术、社会和文化之后，他们的方方面面已经融入了我们的生活之中。"
    WCR_ev_1_flavor: "“西方在工业、学术和文化方面领先世界。我们曾经熟悉的世界正在崩溃。是时候加入列强的行列了！”"
    WCR_ev_1_a:      "现在，我们已经准备好站立在世界舞台上了！"
    
    # Westernization JE long text & helpers
    WCR_LONG_DELIMITER: "   @divider_start!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_end!"
    
    WCR_tt_format_base:     "• #indent_newline:3 $VALUE|+=%2$ $KEY$#!"
    WCR_tt_format_mult:     "• #indent_newline:3 #p x$VALUE|$#! $KEY$#!"
    WCR_tt_delta_breakdown: "[AddLocalizationIf(LessThanOrEqualTo_CFixedPoint(Country.MakeScope.ScriptValue('WCR_sv_calculate_net_delta_from_clout'),'(CFixedPoint)0'),'WCR_tt_delta_from_clout_f')][Country.MakeScope.GetScriptValueDesc('WCR_sv_calculate_westernization_progress_delta')]"
    
    WCR_tt_delta_from_prog_clout:    "来自$WCR_tt_progressives_tt$[Concept('concept_interest_group', '$concept_interest_groups$')]（#bold [Country.MakeScope.ScriptValue('WCR_sv_calculate_total_prog_clout')|%]#!）的[concept_clout]"
    WCR_tt_delta_from_trad_clout:    "来自[concept_powerful]$WCR_tt_conservatives_tt$[Concept('concept_interest_group', '$concept_interest_groups$')]（#bold [Country.MakeScope.ScriptValue('WCR_sv_calculate_total_powerful_trad_clout')|%]#!）的[concept_clout]"
    WCR_tt_delta_from_relations:     "来自与西化国家有$relations_amicable$或$relations_friendly$[concept_relations]"
    WCR_tt_delta_from_year:          "来自#bold 1900年#!或之后"
    WCR_tt_delta_from_early_rollout: "来自[Concept('concept_government_building','$concept_government$')]和[Concept('concept_military_building','$MILITARY$')]的最初西化"
    WCR_tt_delta_from_recognition:   "[Country.GetNameNoFlag]成为[Concept('concept_recognized_power','$concept_recognized_power_short$')]"
    
    WCR_tt_delta_from_overlord_good_rel: "来自拥有$relations_amicable$或$relations_friendly$[concept_relations]的#bold 西化#![concept_overlord]（[SCOPE.GetRootScope.GetCountry.GetOverlord.GetName]）的[SCOPE.GetRootScope.GetCountry.GetNameNoFlag]"
    WCR_tt_delta_from_overlord_civ_mis:  "[SCOPE.GetRootScope.GetCountry.GetNameNoFlag]de [concept_overlord]（[SCOPE.GetRootScope.GetCountry.GetOverlord.GetName]）正在#bold 西化#!并研究[GetTechnology('civilizing_mission').GetName]"
    
    WCR_tt_delta_from_clout:   "$WCR_tt_delta_from_clout_h$#indent_newline:3 \n[Country.MakeScope.GetScriptValueDesc('WCR_sv_calculate_net_delta_from_clout')]#!"
    WCR_tt_delta_from_clout_h: "来自[concept_interest_group][concept_clout]"
    
    WCR_tt_delta_from_clout_f:  "• #v 0.00%#! $WCR_tt_delta_from_clout$#indent_newline:3 \n• $WCR_tt_delta_from_clout_fn$#![AddTextIf(GreaterThan_CFixedPoint(Country.MakeScope.ScriptValue('WCR_sv_calculate_westernization_progress_delta'),'(CFixedPoint)0'),'\n')]"
    WCR_tt_delta_from_clout_fn: "浮动在#v 0.00%#!" # Footnote
    
    WCR_overview_reason: "西化进程将#v 每月递增#!，其速率取决于下面列出的多个因素。"
    
    WCR_breakdown_reason: "西化目前预计下个月将增加#v [SCOPE.ScriptValue('WCR_sv_calculate_westernization_progress_delta')|+=2%]#!。"
    
    WCR_ig_clout_delta_reason: "$WCR_ig_clout_delta_reason_h$#indent_newline:3 \n#indent_newline:2 • $WCR_positive_delta_reason$#!\n#indent_newline:2 • $WCR_negative_delta_reason$#!\n#indent_newline:2 • $WCR_ig_clout_floor_reason$#!#!"
    
    WCR_ig_clout_delta_reason_h: "根据特定[Concept('concept_interest_group', '$concept_interest_groups$')]的[concept_clout]的总分布情况，西化进程每月最多可增加#v [SCOPE.ScriptValue('WCR_TOTAL_PROGRESS_FROM_PROG_CLOUT')|0%]#!："
    
    WCR_ig_clout_floor_reason: "来自[concept_interest_group][concept_clout]的进度不能低于#v 0%#!。"
    
    WCR_positive_delta_reason: "最多将#v 增加#!#p [SCOPE.ScriptValue('WCR_TOTAL_PROGRESS_FROM_PROG_CLOUT')|0%]#!，与任何$WCR_tt_progressives_tt$[Concept('concept_interest_group', '$concept_interest_groups$')]的总[concept_clout]成比例。"
    
    WCR_negative_delta_reason: "最多将#v 移除#!#n [SCOPE.ScriptValue('WCR_TOTAL_STONEWALL_FROM_TRAD_CLOUT')|0%]#!，与任何[concept_powerful]$WCR_tt_conservatives_tt$[Concept('concept_interest_group', '$concept_interest_groups$')]的总[concept_clout]成比例。"
    
    WCR_early_rollout_reason: "在西化进程的最初#v [SCOPE.ScriptValue('WCR_EARLY_ROLLOUT_BONUS_END')]%#!阶段，将获得额外的#p 2%#!进度加成。这是因为早期的西化工作主要集中在为[Concept('concept_government_building','$concept_government$')]和[Concept('concept_military_building','$MILITARY$')]更新制服上。"
    
    WCR_date_reason: "如果到达#bold 1900年#!，进度将额外增加#p 1%#!。"
    
    WCR_overlord_reason: "$WCR_overlord_reason_h$#indent_newline:3 \n#indent_newline:3 • $WCR_overlord_rel_reason$#!\n#indent_newline:3 • $WCR_overlord_civ_reason$#!#!"
    
    WCR_overlord_reason_h: "如果[Country.GetName]中的[concept_overlord]是#bold 西化#!的，并且符合以下任一条件，则会额外增加#p 1%#!的进度："
    
    WCR_overlord_rel_reason: "与[Country.GetName]$relations_amicable$或$relations_friendly$[concept_relations]（[GetDefine('NDiplomacy','RELATIONS_THRESHOLD_AMICABLE')|v]或更高）"
    
    WCR_overlord_civ_reason: "已研究[GetTechnology('civilizing_mission').GetName]"
    
    WCR_westernized_relations_reason: "如果[Country.GetName]与任何已西化国家有着$relations_amicable$或$relations_friendly$[concept_relations]（[GetDefine('NDiplomacy','RELATIONS_THRESHOLD_AMICABLE')|v]或更高），西化的#b 当前每月速率#!将会额外#b 增加#!#p 10%#!。"
    
    WCR_recognized_reason: "如果[Country.GetName]是[Concept('concept_recognized_power','$concept_recognized_power_short$')]，西化的#b 当前每月速率#!将会额外#b 增加#!#p 10%#!。"
    
    WCR_ig_opinion_reason_header: "每#v 25%#!的西化进程："
    
    WCR_ig_opinion_prog_reason: "• 所有$WCR_tt_progressives_tt$[Concept('concept_interest_group', '$concept_interest_groups$')]将获得#p 1#![concept_approval]"
    
    WCR_ig_opinion_trad_reason: "• 所有$WCR_tt_conservatives_tt$[Concept('concept_interest_group', '$concept_interest_groups$')]将失去#n 1#![concept_approval]"
    
    WCR_ig_opinion_done_reason: "在西化#v 完成#!之后，全部获得或失去的[concept_approval]将会在很长一段时间内衰减。"
    
    WCR_je_westernization_reason_long: "$WCR_LONG_DELIMITER$\n\n$WCR_overview_reason$\n\n$WCR_breakdown_reason$\n\n$WCR_LONG_DELIMITER$\n\n$WCR_ig_clout_delta_reason$\n\n$WCR_early_rollout_reason$\n\n$WCR_overlord_reason$\n\n$WCR_date_reason$\n\n$WCR_westernized_relations_reason$\n\n$WCR_recognized_reason$\n\n$WCR_LONG_DELIMITER$\n\n$WCR_ig_opinion_reason_header$#indent_newline:1 \n$WCR_ig_opinion_prog_reason$\n$WCR_ig_opinion_trad_reason$#!\n\n$WCR_ig_opinion_done_reason$"
    
    # Westernization JE status texts
    # Use of GetPlayer in customizable loc text is mandatory due to data context being changed when going through a customizable loc
    WCR_je_westernization_status_0:           "[SCOPE.sCountry('this_country').GetCustom('WCR_cl_westernization_je_status_0')]"
    WCR_je_westernization_status_0_king:      "西化才刚刚开始，[GetPlayer.GetRuler.GetCustom('GetUniversalTitle')][GetPlayer.GetRuler.GetCustom('GetUniversalFullName')]采用了外国服装。"
    WCR_je_westernization_status_0_heir:      "西化才刚刚开始，[GetPlayer.GetHeir.GetCustom('GetUniversalTitle')][GetPlayer.GetHeir.GetCustom('GetUniversalFullName')]就已经以[GetPlayer.GetHeir.GetHerselfHimself]自己作为榜样。"
    WCR_je_westernization_status_0_king_heir: "西化才刚刚开始，[GetPlayer.GetRuler.GetCustom('GetUniversalTitle')][GetPlayer.GetRuler.GetCustom('GetUniversalFullName')]和[GetPlayer.GetHeir.GetCustom('GetUniversalTitle')][GetPlayer.GetHeir.GetCustom('GetUniversalFullName')]为国家树立了榜样。"
    WCR_je_westernization_status_0_neither:   "西化已经在我们的国家开始了。"
    
    WCR_je_westernization_status_5: "[GetInterestGroupVariant('ig_armed_forces', SCOPE.sCountry('this_country')).GetLeader.GetCustom('GetUniversalFullName')]、[Concept('concept_commander', '$concept_commanders$')]、[GetPopType('officers').GetName]和[GetPopType('bureaucrats').GetName]已经配发西式制服。"
    
    WCR_je_westernization_status_10:         "[SCOPE.sCountry('this_country').GetCustom('WCR_cl_westernization_je_status_10')]" 
    WCR_je_westernization_status_10_both:    "[GetPopType('soldiers').GetName]和[GetPopType('clerks').GetName]已经配发西式制服，同时[GetInterestGroupVariant('ig_industrialists', GetPlayer).GetLeader.GetCustom('GetUniversalFullName')]和[GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetLeader.GetCustom('GetUniversalFullName')]也已经开始为同行树立榜样。"
    WCR_je_westernization_status_10_indus:   "[GetPopType('soldiers').GetName]和[GetPopType('clerks').GetName]已经配发西式制服，同时[GetInterestGroupVariant('ig_industrialists', GetPlayer).GetLeader.GetCustom('GetUniversalFullName')]已经开始为[GetInterestGroupVariant('ig_industrialists', GetPlayer).GetLeader.GetHerHis]的同行树立了榜样。"
    WCR_je_westernization_status_10_intel:   "[GetPopType('soldiers').GetName]和[GetPopType('clerks').GetName]已经配发西式制服，同时[GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetLeader.GetCustom('GetUniversalFullName')]已经开始为[GetInterestGroupVariant('ig_intelligentsia', GetPlayer).GetLeader.GetHerHis]的同行树立了榜样。"
    WCR_je_westernization_status_10_neither: "[GetPopType('soldiers').GetName]和[GetPopType('clerks').GetName]已经配发西式制服。"
    
    WCR_je_westernization_status_20: "余下的[GetPopType('capitalists').GetName]们已经采用了西式服装，以便在他们的经济伙伴面前显得更加得体。"
    
    WCR_je_westernization_status_30:      "[SCOPE.sCountry('this_country').GetCustom('WCR_cl_westernization_je_status_30')]" 
    WCR_je_westernization_status_30_tu:   "全体[GetPopType('academics').GetName]与[GetInterestGroupVariant('ig_trade_unions', GetPlayer).GetLeader.GetCustom('GetUniversalFullName')]都加入到了新的时尚潮流之中，西化进展顺利。"
    WCR_je_westernization_status_30_none: "全体[GetPopType('academics').GetName]都加入到了新的时尚潮流之中，西化进展顺利。"
    
    WCR_je_westernization_status_40: "在[GetPopType('engineers').GetName]们的那些富裕同事的影响下，他们开始穿上了洋装。"
    
    WCR_je_westernization_status_50: "随着[GetPopType('machinists').GetName]们采用西式服装，国外潮流继续逐渐渗透进来。"
    
    WCR_je_westernization_status_60:      "[SCOPE.sCountry('this_country').GetCustom('WCR_cl_westernization_je_status_60')]" 
    WCR_je_westernization_status_60_land: "时尚洋风穿城过，传至[GetPopType('shopkeepers').GetName]中，[GetInterestGroupVariant('ig_landowners', GetPlayer).GetLeader.GetCustom('GetUniversalFullName')]虽不欲为，然洋装风尚已至，勉而为之。"
    WCR_je_westernization_status_60_none: "时尚洋风穿过城市传入[GetPopType('shopkeepers').GetName]之中。"
    
    WCR_je_westernization_status_70: "随着新的款式变得更便宜，[GetPopType('laborers').GetName]们已将西洋潮流融入到他们的服装之中。"
    
    WCR_je_westernization_status_80: "[GetPopType('aristocrats').GetName]们为了与其他上流人士相匹配，终于放弃了固守传统，穿上了新的现代服饰。"
    
    WCR_je_westernization_status_90:      "[SCOPE.sCountry('this_country').GetCustom('WCR_cl_westernization_je_status_90')]" 
    WCR_je_westernization_status_90_pb:   "一向固执的[GetInterestGroupVariant('ig_petty_bourgeoisie', GetPlayer).GetLeader.GetCustom('GetUniversalFullName')]和[GetPopType('farmers').GetName]最终将西洋时尚作为一个新常态而接受了。"
    WCR_je_westernization_status_90_none: "一向固执的[GetPopType('farmers').GetName]最终将西洋时尚作为一个新常态而接受了。"
    
    WCR_je_westernization_status_100: "西化完成！"
